<title>历史星图 History Atlas v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<link rel="stylesheet" href="styles.css"/>
<style>
  html,body{margin:0;background:#0B1020;color:#EAEAEA;font-family:"Noto Sans SC",system-ui,sans-serif;}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#0B1020;z-index:9999;transition:opacity .4s ease;}
  #boot .ring{width:46px;height:46px;border-radius:50%;border:2.5px solid rgba(212,175,55,.18);border-top-color:#D4AF37;animation:bootspin .9s linear infinite;}
  #boot .bt{font-family:"Noto Serif SC",serif;font-size:19px;letter-spacing:3px;color:#EAEAEA;}
  #boot .bs{font-size:12.5px;letter-spacing:2px;color:#6b7280;}
  @keyframes bootspin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="root">
  <div id="boot">
    <div class="ring"></div>
    <div class="bt">历史星图 · HISTORY ATLAS</div>
    <div class="bs">正在点亮星空…</div>
  </div>
</div>
